<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>身内ミームスロット</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-1: #09111f;
        --bg-2: #13233f;
        --panel: rgba(13, 20, 35, 0.82);
        --panel-strong: rgba(21, 31, 52, 0.94);
        --text: #f7f5ee;
        --muted: #aab4c6;
        --accent: #ffcc4d;
        --accent-2: #ff6f61;
        --line: rgba(255, 255, 255, 0.12);
        --win: #7dffb2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(255, 182, 77, 0.24), transparent 28%),
          radial-gradient(circle at 20% 20%, rgba(125, 255, 178, 0.18), transparent 22%),
          radial-gradient(circle at 80% 10%, rgba(255, 111, 97, 0.2), transparent 20%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 92%);
        opacity: 0.55;
      }

      .wrap {
        width: min(1080px, calc(100% - 24px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 0 40px;
      }

      .machine {
        width: 100%;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), transparent 14%), var(--panel);
        border: 1px solid var(--line);
        border-radius: 30px;
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        overflow: hidden;
        position: relative;
      }

      .machine::after {
        content: "";
        position: absolute;
        inset: auto -30% -40% -30%;
        height: 240px;
        background: radial-gradient(circle, rgba(255, 204, 77, 0.18), transparent 65%);
        filter: blur(24px);
        pointer-events: none;
      }

      header {
        padding: 28px 24px 16px;
        text-align: center;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--muted);
        letter-spacing: 0.14em;
        font-size: 12px;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 10px;
        font-size: clamp(2rem, 4vw, 4.5rem);
        line-height: 1.02;
        letter-spacing: 0.04em;
      }

      .subtitle {
        margin: 0 auto;
        max-width: 700px;
        color: var(--muted);
        font-size: clamp(0.95rem, 2vw, 1.1rem);
        line-height: 1.8;
      }

      .status-row {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      .status {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.24);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #fff7d7;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .stage {
        padding: 12px 24px 120px;
        display: grid;
        gap: 18px;
      }

      .reels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        width: min(1080px, calc(100vw - 24px));
        margin: 0 auto;
      }

      .reel {
        position: relative;
        padding: 12px;
        border-radius: 26px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.14), transparent 22%),
          linear-gradient(180deg, rgba(13, 20, 35, 0.92), rgba(10, 16, 28, 0.98));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        min-height: 520px;
        overflow: visible;
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1 1 0;
      }

      .reel::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        pointer-events: none;
      }

      .reel-label {
        position: absolute;
        left: 16px;
        top: 16px;
        z-index: 2;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.32);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
      }

      .frame {
        width: 100%;
        height: 420px;
        display: block;
        border-radius: 18px;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 55%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      }

      .strip {
          display: grid;
          grid-template-rows: repeat(3, minmax(0, 1fr));
          gap: 8px;
        height: 100%;
        width: 100%;
        min-height: 0;
        justify-items: center;
        align-items: center;
      }

      .slot-img {
        width: auto;
        max-width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        justify-self: center;
        align-self: center;
        margin: 0 auto;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* initial fade-in from screen corner */
      .slot-img {
        opacity: 0;
        transform: translate(-20px, -20px) scale(0.98);
        transition: transform 360ms cubic-bezier(.2,.8,.2,1), opacity 360ms ease;
        will-change: transform, opacity;
      }

      .slot-img.visible {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }

      .spinning .frame img {
        filter: saturate(1.18) contrast(1.08) brightness(1.04);
        animation: wobble 0.22s linear infinite alternate;
      }

      .stopped .frame img {
        animation: settle 160ms ease-out;
      }

      .controls {
        position: fixed;
        left: 50%;
        bottom: 18px;
        width: min(1080px, calc(100vw - 24px));
        transform: translateX(-50%);
        display: grid;
        gap: 14px;
        justify-items: center;
        z-index: 20;
        pointer-events: none;
        padding: 0;
      }

      .stop-buttons {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
      }

      .stop-buttons button {
        min-width: 0;
        width: 100%;
      }

      .reset-hint {
        color: var(--muted);
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.7;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        color: #120f05;
        font-weight: 900;
        letter-spacing: 0.1em;
        font-size: clamp(1rem, 2vw, 1.15rem);
        text-transform: uppercase;
        padding: 16px 28px;
        min-width: min(420px, 100%);
        border-radius: 18px;
        background: linear-gradient(180deg, #fff0b5, #ffcc4d 44%, #eaaa10);
        box-shadow:
          0 14px 30px rgba(255, 204, 77, 0.28),
          0 4px 0 rgba(133, 86, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        transition: transform 120ms ease, filter 120ms ease;
        pointer-events: auto;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      button:active {
        transform: translateY(3px) scale(0.99);
        box-shadow:
          0 10px 20px rgba(255, 204, 77, 0.2),
          0 1px 0 rgba(133, 86, 0, 0.75),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      .hint {
        color: var(--muted);
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.7;
      }

      .win-overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(4, 7, 12, 0.58);
        backdrop-filter: blur(8px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .win-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      .win-card {
        position: relative;
        width: min(560px, calc(100vw - 32px));
        padding: 34px 24px 28px;
        border-radius: 28px;
        background:
          radial-gradient(circle at top, rgba(125, 255, 178, 0.18), transparent 36%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06)),
          rgba(12, 16, 25, 0.95);
        border: 1px solid rgba(125, 255, 178, 0.34);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        text-align: center;
        overflow: hidden;
      }

      .win-card h2 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.4rem);
        color: var(--win);
        letter-spacing: 0.08em;
      }

      .win-card p {
        margin: 14px 0 0;
        font-size: 1rem;
        line-height: 1.8;
        color: #eef8f0;
      }

      .win-image-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
      }

      .win-image {
        width: 64%;
        max-width: 420px;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.45), 0 4px 8px rgba(0,0,0,0.3);
        transform-origin: center center;
        will-change: transform, filter;
        animation: pulse 900ms ease-in-out infinite, twitch 140ms steps(2, end) infinite;
      }

      @keyframes pulse {
        0% { transform: scale(0.96); filter: drop-shadow(0 6px 18px rgba(0,0,0,0.28)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 12px 28px rgba(0,0,0,0.38)); }
        100% { transform: scale(0.96); filter: drop-shadow(0 6px 18px rgba(0,0,0,0.28)); }
      }

      @keyframes twitch {
        0% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-2px) rotate(-1deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(1px) rotate(1deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      .spark {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
      }

      .spark.show {
        animation: pop 900ms ease-out forwards;
      }

      .confetti {
        position: fixed;
        top: -12px;
        width: 10px;
        height: 16px;
        border-radius: 3px;
        pointer-events: none;
        animation: fall linear forwards;
      }

      @keyframes wobble {
        from {
          transform: scale(1.02) translateY(0) rotate(-1.4deg);
        }
        to {
          transform: scale(1.04) translateY(-2px) rotate(1.4deg);
        }
      }

      @keyframes settle {
        0% {
          transform: scale(1.06) rotate(1deg);
          filter: brightness(1.1);
        }
        100% {
          transform: scale(1.02) rotate(0deg);
          filter: none;
        }
      }

      @keyframes pop {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        100% {
          transform: scale(2.8) translateY(-48px);
          opacity: 0;
        }
      }

      @keyframes fall {
        0% {
          transform: translate3d(0, -20px, 0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) rotate(540deg);
          opacity: 0.95;
        }
      }

      @media (max-width: 900px) {
        .reels {
          grid-template-columns: 1fr;
        }

        .reel {
          min-height: 240px;
        }

        .frame {
          min-height: 216px;
        }

        button {
          min-width: 0;
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="machine" aria-label="身内ミームスロットマシン">
        <header>
          <div class="eyebrow">Meme slot / sozai edition</div>
          <h1>身内ミームスロット</h1>
          <p class="subtitle">`sozai` フォルダの写真を順番にぐるぐる回します。ボタンを押した瞬間に停止し、3つそろったら特別演出が出ます。</p>
          <div class="status-row">
          <div class="status" id="statusText">回転中</div>
          <div style="width:18px"></div>
          <div class="status" id="fundsDisplay">所持金: 0G</div>
        </div>
        </header>

        <div class="stage">
          <div class="reels" id="reels" aria-live="polite"></div>

          <div class="controls">
            <div class="bet-controls" style="display:flex;gap:10px;align-items:center;margin-bottom:8px;pointer-events:auto">
              <div style="color:var(--muted);font-weight:700">倍率</div>
              <label><input type="radio" name="betMultiplier" value="1" checked> x1</label>
              <label><input type="radio" name="betMultiplier" value="3"> x3</label>
              <label><input type="radio" name="betMultiplier" value="5"> x5</label>
              <label><input type="radio" name="betMultiplier" value="10"> x10</label>
              <label><input type="radio" name="betMultiplier" value="30"> x30</label>
            </div>
            <div style="display:flex;justify-content:center;margin-bottom:8px">
              <button id="spinButton" type="button" aria-label="スピンを開始する">SPIN</button>
            </div>
            <div class="stop-buttons" aria-label="各リールの停止ボタン">
              <button id="stopButton1" type="button" aria-label="1番のリールを停止する">STOP 1</button>
              <button id="stopButton2" type="button" aria-label="2番のリールを停止する">STOP 2</button>
              <button id="stopButton3" type="button" aria-label="3番のリールを停止する">STOP 3</button>
            </div>
            <div class="reset-hint">左から順に止められます。全部止まったらもう一回押して再スタートできます。</div>
          </div>
        </div>
      </section>
    </main>

    <div class="win-overlay" id="winOverlay" aria-hidden="true">
      <div class="win-card">
        <div class="win-image-wrap"><img id="winImage" class="win-image" alt="当たり画像" src="" /></div>
        <h2>大当たり</h2>
        <p id="winText">3つそろったので、お祝い演出を発生させました。<br />身内ミームの圧が強いです。</p>
      </div>
    </div>

    <script>
      const imageFiles = [
        "sozai/4.jpg",
        "sozai/PXL_20251222_035308012.MP2.jpg",
        "sozai/PXL_20260423_090001224.MP.jpg",
        "sozai/PXL_20260515_022750200.jpg",
        "sozai/PXL_20260518_095927128.jpg",
      ];

      const reelCount = 3;
      const reelsContainer = document.getElementById("reels");
      const stopButtons = [
        document.getElementById("stopButton1"),
        document.getElementById("stopButton2"),
        document.getElementById("stopButton3"),
      ];
      const statusText = document.getElementById("statusText");
      const winOverlay = document.getElementById("winOverlay");

      const reels = [];
      let spinning = false;
      let stoppedReels = new Set();
      let nextStopIndex = 0;
      let winAnimationToken = 0;
      // money / betting
      let funds = 100; // starting money
      const baseCost = 10; // per spin base cost
      const baseReward = 20; // base reward for a win
      let selectedMultiplier = 1;

      function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function preloadImages() {
        for (const file of imageFiles) {
          const image = new Image();
          image.src = file;
        }
      }

      function updateFundsDisplay() {
        const el = document.getElementById('fundsDisplay');
        if (el) el.textContent = `所持金: ${funds}G`;
        if (funds <= 0) {
          handleGameOver();
        }
      }

      function handleGameOver() {
        // Disable controls and show GAME OVER status
        statusText.textContent = 'GAME OVER';
        const spinBtn = document.getElementById('spinButton');
        if (spinBtn) spinBtn.disabled = true;
        document.querySelectorAll('input[name="betMultiplier"]').forEach((el) => { el.disabled = true; });
        stopButtons.forEach((b) => { if (b) b.disabled = true; });
      }

      function buildReels() {
        reelsContainer.innerHTML = "";

        for (let index = 0; index < reelCount; index += 1) {
          const reel = document.createElement("article");
          reel.className = "reel stopped";
          reel.innerHTML = `
            <div class="reel-label">REEL ${index + 1}</div>
            <div class="frame">
              <div class="strip">
                <img class="slot-img" alt="上段" draggable="false" />
                <img class="slot-img" alt="中段" draggable="false" />
                <img class="slot-img" alt="下段" draggable="false" />
              </div>
            </div>
          `;
          reelsContainer.appendChild(reel);
          // each reel gets its own shuffled sequence
          const sequence = shuffleArray(imageFiles);
          reels.push({
            element: reel,
            images: Array.from(reel.querySelectorAll(".slot-img")),
            sequence,
            index: Math.floor(Math.random() * sequence.length),
            speed: 243,
            timer: null,
            stopped: false,
            stripTx: 0,
            stripTy: '0',
            animating: false,
          });
        }
      }

      function renderReel(reel) {
        const seq = reel.sequence || imageFiles;
        const len = seq.length;
        for (let i = 0; i < 3; i += 1) {
          const idx = (reel.index + i) % len;
          reel.images[i].src = seq[idx];
          reel.images[i].alt = `ミーム画像 ${idx + 1}`;
        }
      }

      // helper to apply combined transforms (tx in px, ty as CSS value like '0' or '-33.333%')
      function updateStripTransform(reel) {
        const strip = reel.element.querySelector('.strip');
        if (!strip) return;
        const tx = reel.stripTx || 0;
        const ty = reel.stripTy || '0';
        strip.style.transform = `translateX(${tx}px) translateY(${ty})`;
      }

      function animateTick(reel) {
        if (reel.animating) return;
        const strip = reel.element.querySelector('.strip');
        if (!strip) return;
        reel.animating = true;
        // move up by one row (frame is 3 rows)
        reel.stripTy = '-33.333%';
        // use transform transition sized to reel.speed so visual tick matches timer
        const transMs = Math.max(12, Math.round(reel.speed));
        strip.style.transition = `transform ${transMs}ms linear`;
        updateStripTransform(reel);
        const onEnd = (e) => {
          if (e.propertyName !== 'transform') return;
          strip.removeEventListener('transitionend', onEnd);
          // advance logical index and re-render images
          const seq = reel.sequence || imageFiles;
          const len = seq.length;
          reel.index = (reel.index + 1) % len;
          renderReel(reel);
          // reset translateY without animation
          strip.style.transition = 'none';
          reel.stripTy = '0';
          updateStripTransform(reel);
          // force reflow then clear inline transition
          void strip.offsetWidth;
          strip.style.transition = '';
          reel.animating = false;
        };
        strip.addEventListener('transitionend', onEnd);
      }

      function tickReel(reel) {
        // animate the visual tick
        animateTick(reel);
      }

      function clearReelTimer(reel) {
        if (reel.timer !== null) {
          window.clearInterval(reel.timer);
          reel.timer = null;
        }
      }

      function setSpinningState(nextState) {
        spinning = nextState;
        reels.forEach((reel, index) => {
          reel.element.classList.toggle("spinning", nextState);
          reel.element.classList.toggle("stopped", !nextState);
          reel.stopped = !nextState;
          stopButtons[index].textContent = nextState ? `STOP ${index + 1}` : `RESTART ${index + 1}`;
          stopButtons[index].setAttribute(
            "aria-label",
            nextState
              ? `${index + 1}番のリールを停止する`
              : `${index + 1}番のリールを再スタートする`,
          );
          // when starting spin, only enable the next required button (left-to-right)
          if (nextState) {
            nextStopIndex = 0;
            stopButtons[index].disabled = index !== nextStopIndex;
          } else {
            stopButtons[index].disabled = false;
          }
        });
        // enable/disable bet controls while spinning
        document.querySelectorAll('input[name="betMultiplier"]').forEach((el) => { el.disabled = nextState; });
        // enable/disable spin button
        const spinBtn = document.getElementById('spinButton');
        if (spinBtn) spinBtn.disabled = nextState;
        statusText.textContent = nextState ? "回転中" : "停止中";
      }

      function startSpin() {
        // read selected multiplier from radio buttons
        const sel = document.querySelector('input[name="betMultiplier"]:checked');
        selectedMultiplier = sel ? Number(sel.value) : 1;
        const cost = baseCost * selectedMultiplier;
        if (funds < cost) {
          statusText.textContent = '所持金不足';
          return;
        }
        // deduct cost immediately
        funds -= cost;
        updateFundsDisplay();

        reels.forEach((reel) => {
          // reshuffle each reel on start for more randomness
          reel.sequence = shuffleArray(imageFiles);
          reel.index = Math.floor(Math.random() * reel.sequence.length);
          clearReelTimer(reel);
          reel.stopped = false;
          // clear any previous locked final center
          reel.finalCenter = null;
        });
        stoppedReels = new Set();
        setSpinningState(true);
        hideWinOverlay();

        reels.forEach((reel, index) => {
          reel.speed = 126; // unified speed (slower: 2/3 of previous)
          reel.timer = window.setInterval(() => {
            tickReel(reel);
          }, reel.speed);
        });
      }

      function currentCenterSymbols() {
        return reels.map((reel) => {
          const seq = reel.sequence || imageFiles;
          const len = seq.length;
          return seq[(reel.index + 1) % len];
        });
      }

      function showWinOverlay(amount, imgSrc) {
        winAnimationToken += 1;
        const token = winAnimationToken;

        // set win image if provided
        const winImg = document.getElementById('winImage');
        if (winImg) {
          if (imgSrc) {
            winImg.src = imgSrc;
            winImg.classList.add('visible');
          } else {
            winImg.src = '';
            winImg.classList.remove('visible');
          }
        }

        winOverlay.classList.add("show");
        winOverlay.setAttribute("aria-hidden", "false");
        statusText.textContent = "大当たり";
        const wt = document.getElementById('winText');
        if (wt) wt.innerHTML = `3つそろったので、お祝い演出を発生させました。<br />獲得: ${amount}G`;

        createConfetti();
        createSparks();

        window.setTimeout(() => {
          if (token !== winAnimationToken) {
            return;
          }
          clearConfetti();
        }, 1200);
      }

      function hideWinOverlay() {
        winAnimationToken += 1;
        const winImg = document.getElementById('winImage');
        if (winImg) {
          winImg.src = '';
          winImg.classList.remove('visible');
        }
        winOverlay.classList.remove("show");
        winOverlay.setAttribute("aria-hidden", "true");
        clearConfetti();
      }

      function createConfetti() {
        clearConfetti();

        const colors = ["#ffcc4d", "#7dffb2", "#ff6f61", "#82cfff", "#ffffff"];
        const pieces = 30;

        for (let index = 0; index < pieces; index += 1) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.background = colors[index % colors.length];
          piece.style.width = `${8 + Math.random() * 8}px`;
          piece.style.height = `${10 + Math.random() * 12}px`;
          piece.style.opacity = `${0.75 + Math.random() * 0.25}`;
          piece.style.setProperty("--drift", `${(Math.random() - 0.5) * 260}px`);
          piece.style.animationDuration = `${1200 + Math.random() * 700}ms`;
          piece.style.animationDelay = `${Math.random() * 120}ms`;
          document.body.appendChild(piece);
        }
      }

      function clearConfetti() {
        document.querySelectorAll(".confetti, .spark").forEach((node) => node.remove());
      }

      function createSparks() {
        const card = document.querySelector(".win-card");
        const rect = card.getBoundingClientRect();

        for (let index = 0; index < 12; index += 1) {
          const spark = document.createElement("div");
          spark.className = "spark show";
          const size = 8 + Math.random() * 12;
          spark.style.width = `${size}px`;
          spark.style.height = `${size}px`;
          spark.style.left = `${rect.left + rect.width * Math.random()}px`;
          spark.style.top = `${rect.top + rect.height * Math.random()}px`;
          spark.style.background = ["#ffcc4d", "#7dffb2", "#ff6f61", "#ffffff"][index % 4];
          document.body.appendChild(spark);
        }
      }

      function evaluateWin(retries = 8) {
        // If any reel is still animating, wait a bit and retry (up to retries times).
        if (retries > 0 && reels.some((r) => r.animating)) {
          setTimeout(() => evaluateWin(retries - 1), 60);
          return;
        }
        // Evaluate visible middle images for a win.
        function normalizeSrc(src) {
          if (!src) return null;
          try {
            const u = new URL(src, location.href);
            const parts = u.pathname.split('/');
            const name = parts.pop() || parts.pop();
            return decodeURIComponent(name || '').toLowerCase();
          } catch (e) {
            return String(src).toLowerCase();
          }
        }

        const centers = reels.map((reel) => {
          if (reel.finalCenterNormalized) return reel.finalCenterNormalized;
          const img = reel.element.querySelectorAll('.slot-img')[1];
          return img ? normalizeSrc(img.src) : null;
        });
        const matched = centers.every((s) => s && s === centers[0]);
        if (matched) {
          const reward = baseReward * selectedMultiplier;
          funds += reward;
          updateFundsDisplay();
          // choose a display src for the matched image (prefer locked finalCenter)
          const displaySrc = (reels[0] && reels[0].finalCenter) ? reels[0].finalCenter : currentCenterSymbols()[0];
          showWinOverlay(reward, displaySrc);
          return;
        }
        statusText.textContent = "停止中";
        if (funds <= 0) {
          handleGameOver();
        }
      }

      function stopSpin() {
        // mark UI as stopped immediately, but wait for visual animations to finish
        setSpinningState(false);
        // animation duration used for vertical tick is ~140ms; wait slightly longer
        setTimeout(evaluateWin, 160);
      }

      function stopReel(index) {
        const reel = reels[index];

        if (!spinning) {
          // ignore stops when not spinning
          return;
        }

        // enforce stop order: only allow stopping the next expected reel
        if (index !== nextStopIndex) {
          // ignore out-of-order clicks
          return;
        }

        if (reel.stopped) {
          return;
        }

        // capture current logical index and whether an animation is in-progress
        const wasAnimating = !!reel.animating;
        const currentIndex = reel.index;

        clearReelTimer(reel);
        reel.stopped = true;
        stoppedReels.add(index);
        reel.element.classList.remove("spinning");
        reel.element.classList.add("stopped");
        stopButtons[index].disabled = true;
        stopButtons[index].textContent = `STOPPED ${index + 1}`;

        // Determine the logical final center symbol based on current index and whether
        // a tick animation was in-flight. If animating, the index will be advanced
        // once the transition completes, so account for that.
        try {
          const seq = reel.sequence || imageFiles;
          const len = seq.length;
          const finalIdx = wasAnimating ? (currentIndex + 2) % len : (currentIndex + 1) % len;
          const finalSrc = seq[finalIdx];
          reel.finalCenter = finalSrc || null;
          // store normalized filename key for comparison
          try {
            const u = new URL(reel.finalCenter, location.href);
            const parts = u.pathname.split('/');
            const name = parts.pop() || parts.pop();
            reel.finalCenterNormalized = decodeURIComponent(name || '').toLowerCase();
          } catch (e) {
            reel.finalCenterNormalized = reel.finalCenter ? String(reel.finalCenter).toLowerCase() : null;
          }
        } catch (e) {
          reel.finalCenter = null;
          reel.finalCenterNormalized = null;
        }

        // advance nextStopIndex and enable the next button if applicable
        nextStopIndex += 1;
        if (nextStopIndex < reels.length) {
          stopButtons[nextStopIndex].disabled = false;
        }

        if (stoppedReels.size !== reels.length) {
          return;
        }

        stopSpin();
      }

      stopButtons.forEach((button, index) => {
        button.addEventListener("click", () => {
          stopReel(index);
        });
      });

      // Spin button handler
      const spinButton = document.getElementById('spinButton');
      if (spinButton) {
        spinButton.addEventListener('click', () => {
          startSpin();
        });
      }

      winOverlay.addEventListener("click", () => {
        // simply hide the overlay; do NOT auto-start a new spin
        hideWinOverlay();
      });

      // Align each reel's horizontal center to the corresponding stop button center.
      function alignReelsToButtons() {
        const container = reelsContainer.getBoundingClientRect();
        stopButtons.forEach((btn, i) => {
          const reel = reels[i];
          if (!reel) return;
          const btnRect = btn.getBoundingClientRect();
          const btnCenter = btnRect.left + btnRect.width / 2 - container.left;
          const midImg = reel.element.querySelectorAll('.slot-img')[1];
          if (!midImg) return;
          const midRect = midImg.getBoundingClientRect();
          const midCenter = midRect.left + midRect.width / 2 - container.left;
          const delta = Math.round(btnCenter - midCenter);
          const strip = reel.element.querySelector('.strip');
          if (strip) {
            strip.style.transform = `translateX(${delta}px)`;
            strip.style.transition = 'transform 0ms';
          }
        });
      }

      window.addEventListener('resize', () => {
        setTimeout(alignReelsToButtons, 80);
      });

      // Fade in images from screen corner on first load
      function fadeInFromCorner() {
        const imgs = Array.from(document.querySelectorAll('.slot-img'));
        imgs.forEach((img, i) => {
          img.classList.remove('visible');
          // staggered appearance
          setTimeout(() => img.classList.add('visible'), 80 + i * 60);
        });
      }

      preloadImages();
      buildReels();
      reels.forEach(renderReel);
      updateFundsDisplay();
      // initial alignment
      setTimeout(alignReelsToButtons, 80);
      // initial fade-in from corner
      setTimeout(fadeInFromCorner, 120);
    </script>
  </body>
</html>
